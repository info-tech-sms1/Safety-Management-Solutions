<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" fill="none" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A456F"/>
      <stop offset="50%" stop-color="#275079"/>
      <stop offset="100%" stop-color="#0F2C47"/>
    </linearGradient>
    <linearGradient id="skyHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82D4F8"/>
      <stop offset="100%" stop-color="#62B5DA"/>
    </linearGradient>
    <linearGradient id="orangeArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4974C"/>
      <stop offset="100%" stop-color="#F0853F"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F2C47" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring (Navy 700) with subtle gap for the Orange Arc -->
  <circle cx="160" cy="150" r="120" stroke="#1A456F" stroke-width="12" fill="none" opacity="0.95" />

  <!-- Orange Arc along the upper-right perimeter (Accent) -->
  <path d="M 160 30 A 120 120 0 0 1 274 195" stroke="url(#orangeArcGrad)" stroke-width="14" stroke-linecap="round" fill="none" />

  <!-- Inner Concentric Guide Ring in subtle Sky 400 -->
  <circle cx="160" cy="150" r="102" stroke="#62B5DA" stroke-width="2.5" stroke-dasharray="4 6" fill="none" opacity="0.6"/>

  <!-- Protective Shield -->
  <g filter="url(#softGlow)">
    <path d="M 160 62 
             C 198 62, 222 74, 226 98 
             C 226 150, 192 195, 160 216 
             C 128 195, 94 150, 94 98 
             C 98 74, 122 62, 160 62 Z" 
          fill="url(#shieldGrad)" 
          stroke="#62B5DA" 
          stroke-width="4.5" />

    <!-- Inner Shield Rim Highlight -->
    <path d="M 160 74 
             C 190 74, 210 84, 213 104 
             C 213 145, 185 182, 160 199 
             C 135 182, 107 145, 107 104 
             C 110 84, 130 74, 160 74 Z" 
          fill="none" 
          stroke="#62B5DA" 
          stroke-width="1.5" 
          opacity="0.5" />
  </g>

  <!-- Upward Dynamic Arrow (Progress, Elevation, Vigilance) -->
  <path d="M 160 84 L 176 114 L 166 114 L 166 142 L 154 142 L 154 114 L 144 114 Z" 
        fill="url(#skyHighlight)" 
        stroke="#FFFFFF" 
        stroke-width="1" />

  <!-- Running Figure (Life Safety, Emergency Evacuation) -->
  <g fill="#FFFFFF">
    <!-- Head -->
    <circle cx="164" cy="130" r="7.5" />
    <!-- Torso / dynamic forward lean -->
    <path d="M 160 138 L 168 152 L 158 166 L 152 163 L 157 151 L 154 142 Z" />
    <!-- Back Leg (in stride) -->
    <path d="M 158 166 L 142 176 L 138 171 L 152 162 Z" />
    <!-- Front Leg (bent forward knee) -->
    <path d="M 158 166 L 170 178 L 176 195 L 170 196 L 165 181 L 154 168 Z" />
    <!-- Arms in motion -->
    <path d="M 158 143 L 146 150 L 143 145 L 154 140 Z" />
    <path d="M 164 144 L 176 148 L 180 158 L 175 160 L 172 151 L 162 147 Z" />
  </g>

  <!-- Brand Typography: "SMS" Lettering Below Logo -->
  <text x="160" y="278" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-size="46" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#275079">SMS</text>

  <!-- Subtitle Tagline Anchor -->
  <text x="160" y="302" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="2.5" 
        fill="#1A456F" 
        opacity="0.9">SAFETY MANAGEMENT SOLUTIONS</text>
</svg>
